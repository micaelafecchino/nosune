<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Compras recurrentes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0E6B5B;text-decoration:none}a:hover{color:#0A4F43}
button,input{font-family:inherit}
input::placeholder{color:#5A6662}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F5; color: #16201D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 52px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #5A6662">Rosa · mamá</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Compras</h1>
    </div>
    <button aria-label="Agregar compra recurrente" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ítem
    </button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <article style="{{it.cardStyle}}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 16px; font-weight: 700">{{it.name}}</span>
            <span style="{{it.kindStyle}}">{{it.kind}}</span>
          </div>
          <span style="{{it.leftStyle}}">{{it.left}}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #2A3532">
          <span style="display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6662" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>{{it.rx}}
          </span>
          <span style="display: flex; align-items: center; gap: 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6662" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>{{it.remind}}
          </span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="{{it.ownerDot}}">{{it.ownerInitial}}</span>
            <span style="font-weight: 600">{{it.ownerLabel}}</span>
          </span>
        </div>

        <sc-if value="{{it.showButton}}" hint-placeholder-val="{{true}}">
          <button onClick="{{it.open}}" style="min-height: 44px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; color: #16201D; font-size: 14px; font-weight: 700; cursor: pointer">Marcar como comprado</button>
        </sc-if>

        <sc-if value="{{it.isOpen}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 12px; background: #F4F6F5; border-radius: 14px; padding: 14px">
            <div role="group" aria-label="Quién lo compró" style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; font-weight: 700">¿Quién lo compró?</span>
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{it.buyers}}" as="b" hint-placeholder-count="3">
                  <button onClick="{{b.pick}}" aria-pressed="{{b.pressed}}" style="{{b.style}}">{{b.label}}</button>
                </sc-for>
              </div>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; font-weight: 700">¿Cuánto salió? <span style="font-size: 11px; font-weight: 600; color: #4A5653; background: #E2E7E5; padding: 2px 6px; border-radius: 999px; margin-left: 4px">Opcional</span></span>
              <input type="text" inputmode="decimal" placeholder="$ 0" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 15px; color: #16201D">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; font-weight: 700">¿Dónde lo compraste? <span style="font-size: 11px; font-weight: 600; color: #4A5653; background: #E2E7E5; padding: 2px 6px; border-radius: 999px; margin-left: 4px">Opcional</span></span>
              <input type="text" placeholder="Ej.: farmacia del barrio" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 15px; color: #16201D">
            </label>
            <div style="display: flex; gap: 8px">
              <button onClick="{{it.save}}" style="flex: 1; min-height: 44px; border-radius: 12px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Guardar</button>
              <button onClick="{{it.cancel}}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; color: #16201D; font-size: 14px; font-weight: 600; cursor: pointer">Cancelar</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{it.isBought}}" hint-placeholder-val="{{false}}">
          <div role="status" style="display: flex; align-items: center; gap: 10px; background: #E3F1EE; border-radius: 12px; padding: 12px">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 700; color: #0A4F43">{{it.boughtLabel}}</span>
              <span style="font-size: 12px; color: #2A3532">Próximo recordatorio: {{it.next}}</span>
            </span>
            <button onClick="{{it.undo}}" style="min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #B9D3CC; background: #FFFFFF; color: #16201D; font-size: 12px; font-weight: 600; cursor: pointer">Deshacer</button>
          </div>
        </sc-if>
      </article>
    </sc-for>
  </main>

  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E7E5; padding: 8px 4px 28px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #5A6662; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #5A6662; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Turnos</a>
    <a href="Diario.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #5A6662; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Diario</a>
    <a href="Compras.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Compras</a>
    <a href="Familia.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #5A6662; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/></svg>Perfiles</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B5B","options":["#0E6B5B","#2F5DA8","#6B3FA0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null, buyer: 'laura', bought: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B5B';
    const s = this.state;
    const who = {
      yo: { name: 'Vos', initial: 'V', bg: '#E3F1EE', fg: accent },
      juan: { name: 'Juan', initial: 'J', bg: '#E8EEF8', fg: '#2F5DA8' },
      laura: { name: 'Laura', initial: 'L', bg: '#FBEEDF', fg: '#A4500B' }
    };
    const base = [
      { id: 'ena', name: 'Enalapril 10 mg', kind: 'Medicamento', left: 'Quedan 4 días', urgent: true, rx: 'Receta vigente hasta 28/12 · Dr. Sosa', remind: 'WhatsApp a Laura, 3 días antes', owner: 'laura', next: '1 de diciembre' },
      { id: 'pro', name: 'Protectores descartables', kind: 'Ítem de cuidado', left: 'Quedan 9 días', urgent: false, rx: 'No necesita receta', remind: 'Email a vos, 4 días antes', owner: 'yo', next: '10 de diciembre' },
      { id: 'cal', name: 'Calcio + vitamina D', kind: 'Medicamento', left: 'Quedan 18 días', urgent: false, rx: 'No necesita receta', remind: 'Notificación a Juan, 5 días antes', owner: 'juan', next: '15 de diciembre' }
    ];
    const items = base.map((it) => {
      const isOpen = s.open === it.id;
      const boughtBy = s.bought[it.id];
      const o = who[it.owner];
      return {
        ...it,
        isOpen,
        isBought: !!boughtBy,
        showButton: !isOpen && !boughtBy,
        boughtLabel: boughtBy ? (boughtBy === 'yo' ? 'Lo compraste vos hoy' : 'Lo compró ' + who[boughtBy].name + ' hoy') : '',
        open: () => this.setState({ open: it.id, buyer: it.owner }),
        cancel: () => this.setState({ open: null }),
        save: () => this.setState({ open: null, bought: { ...this.state.bought, [it.id]: this.state.buyer } }),
        undo: () => { const b = { ...this.state.bought }; delete b[it.id]; this.setState({ bought: b }); },
        buyers: Object.keys(who).map((id) => {
          const on = s.buyer === id;
          return {
            label: who[id].name, pressed: on ? 'true' : 'false',
            pick: () => this.setState({ buyer: id }),
            style: 'min-height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #16201D; color: #FFFFFF; border: 1px solid #16201D;' : 'background: #FFFFFF; color: #16201D; border: 1px solid #E2E7E5;')
          };
        }),
        ownerLabel: it.owner === 'yo' ? 'Vos te encargás' : o.name + ' se encarga',
        ownerInitial: o.initial,
        ownerDot: 'width: 22px; height: 22px; border-radius: 999px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: ' + o.bg + '; color: ' + o.fg + ';',
        cardStyle: 'background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; ' + (it.urgent && !boughtBy ? 'border: 2px solid #E8B98F;' : 'border: 1px solid #E2E7E5;'),
        kindStyle: 'align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; ' + (it.kind === 'Medicamento' ? 'background: #FBEEDF; color: #7A3A06;' : 'background: #E8EEF8; color: #234A87;'),
        leftStyle: 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; ' + (it.urgent && !boughtBy ? 'background: #FBEEDF; color: #7A3A06;' : 'background: #EEF1F0; color: #2A3532;')
      };
    });
    return { accent, items };
  }
}
</script>
</body>
</html>
