<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Tareas de hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div>
      <span style="font-size: 17px; color: #3F4A47">Rosa · mamá</span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700">Tareas de hoy</h1>
    </div>
    <span style="font-size: 19px">{{summary}}</span>
    <div role="group" aria-label="Qué tareas ver" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #DCE3E0; padding: 4px; border-radius: 14px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="t" hint-placeholder-count="6">
      <sc-if value="{{t.showGroup}}" hint-placeholder-val="{{false}}">
        <h2 style="margin: 10px 0 0; font-size: 20px; font-weight: 700">{{t.group}}</h2>
      </sc-if>
      <div style="{{t.cardStyle}}">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 18px; font-weight: 700; color: #3F4A47">{{t.time}}</span>
          <span style="{{t.titleStyle}}">{{t.title}}</span>
          <span style="{{t.ownerStyle}}">{{t.ownerText}}</span>
        </span>
        <button onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" aria-label="{{t.aria}}" style="{{t.btnStyle}}">
          <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
          </sc-if>
        </button>
      </div>
    </sc-for>
  </main>

  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: #FFFFFF; border-top: 1.5px solid #CFD8D4; padding: 8px 4px 26px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Turnos</a>
    <a href="Cargar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; margin-top: -30px; color: #121A17; font-size: 16px; font-weight: 700">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-shadow: 0 4px 14px rgba(11,90,76,0.35)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Cargar</a>
    <a href="Diario.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: {{accent}}; font-size: 15px; font-weight: 700; background: #E1EFEB">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Diario</a>
    <a href="Compras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Compras</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 1: { by: 'laura', at: '8:05' }, 2: { by: 'laura', at: '10:20' } }, mine: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const names = { yo: 'Te toca a vos', juan: 'Le toca a Juan', laura: 'Le toca a Laura' };
    const base = [
      { id: 1, group: 'Mañana', time: '8:00', title: 'Enalapril 10 mg', owner: 'laura' },
      { id: 2, group: 'Mañana', time: '10:00', title: 'Caminar 20 minutos', owner: 'laura' },
      { id: 3, group: 'Tarde', time: '17:00', title: 'Ejercicios de rodilla', owner: 'yo' },
      { id: 4, group: 'Tarde', time: '18:00', title: 'Tomar la presión', owner: 'laura' },
      { id: 5, group: 'Noche', time: '20:00', title: 'Enalapril 10 mg', owner: 'laura' },
      { id: 6, group: 'Noche', time: '21:00', title: 'Calcio + vitamina D', owner: 'juan' }
    ];
    const done = this.state.done;
    const list = base.filter((t) => !this.state.mine || t.owner === 'yo');
    const items = list.map((t, i) => {
      const d = !!done[t.id];
      return {
        ...t,
        done: d,
        showGroup: i === 0 || list[i - 1].group !== t.group,
        ownerText: d ? (done[t.id].by === 'yo' ? 'Lo marcaste vos' + (done[t.id].at ? ' a las ' + done[t.id].at : ' recién') : 'Lo marcó ' + { juan: 'Juan', laura: 'Laura' }[done[t.id].by] + ' a las ' + done[t.id].at) : names[t.owner],
        ownerStyle: 'font-size: 17px; ' + (d ? 'font-weight: 700; color: #08453A;' : 'color: #3F4A47;'),
        pressed: d ? 'true' : 'false',
        aria: (d ? 'Desmarcar ' : 'Marcar como hecho: ') + t.title + ', ' + t.time,
        toggle: () => {
          const next = { ...this.state.done };
          if (next[t.id]) delete next[t.id]; else next[t.id] = { by: 'yo', at: '' };
          this.setState({ done: next });
        },
        cardStyle: 'border-radius: 18px; padding: 14px 14px 14px 18px; display: flex; gap: 12px; align-items: center; ' + (d ? 'background: #E9EEEC; border: 1.5px solid #DCE3E0;' : 'background: #FFFFFF; border: 1.5px solid #CFD8D4;'),
        titleStyle: 'font-size: 20px; font-weight: 700; line-height: 1.25; ' + (d ? 'color: #3F4A47; text-decoration: line-through;' : 'color: #121A17;'),
        btnStyle: 'width: 60px; height: 60px; flex-shrink: 0; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; ' + (d ? 'background: ' + accent + '; border: 3px solid ' + accent + ';' : 'background: #FFFFFF; border: 3px solid #6B7773;')
      };
    });
    const pending = base.filter((t) => !done[t.id]).length;
    const filters = [['all', 'Todas'], ['mine', 'Las mías']].map(([id, label]) => {
      const on = (id === 'mine') === this.state.mine;
      return {
        label, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ mine: id === 'mine' }),
        style: 'min-height: 48px; border-radius: 11px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #121A17;' : 'background: transparent; color: #3F4A47;')
      };
    });
    return {
      accent, items, filters,
      summary: pending === 0 ? 'Todo hecho por hoy' : 'Faltan ' + pending + ' de ' + base.length
    };
  }
}
</script>
</body>
</html>
