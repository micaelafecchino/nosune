<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Perfiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 4px">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver</a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700">¿A quién querés ver?</h1>

    <sc-for list="{{profiles}}" as="p" hint-placeholder-count="4">
      <button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.row}}">
        <span style="{{p.avatar}}">{{p.initial}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left">
          <span style="font-size: 20px; font-weight: 700">{{p.name}}</span>
          <span style="font-size: 17px; color: #3F4A47">{{p.desc}}</span>
        </span>
      </button>
    </sc-for>

    <a href="NuevoPerfil.dc.html" style="min-height: 56px; border-radius: 16px; border: 2px dashed #9AA6A2; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #121A17">+ Agregar a alguien que cuido</a>

    <section aria-labelledby="ayudan" style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; margin-top: 6px">
      <h2 id="ayudan" style="margin: 0; font-size: 21px; font-weight: 700">Quién ayuda con {{sel.name}}</h2>
      <sc-for list="{{sel.collabs}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px; border-bottom: 1.5px solid #E3E8E6">
          <span style="font-size: 19px; font-weight: 700">{{c.name}}</span>
          <span style="font-size: 17px; color: #3F4A47">{{c.role}}</span>
        </div>
      </sc-for>
      <sc-if value="{{sel.canInvite}}" hint-placeholder-val="{{true}}">
        <button style="min-height: 56px; border-radius: 14px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 700; cursor: pointer">Invitar a alguien</button>
      </sc-if>
      <sc-if value="{{sel.cannotInvite}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 17px; color: #3F4A47">Solo Héctor puede invitar a otras personas.</span>
      </sc-if>
    </section>

    <sc-if value="{{sel.hasFolder}}" hint-placeholder-val="{{false}}">
      <a href="Carpeta.dc.html" style="min-height: 64px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #CFD8D4; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 18px; font-weight: 700; color: #121A17">Carpeta: Cáncer de mama
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></a>
    </sc-if>

    <div style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; display: flex; flex-direction: column">
      <button style="min-height: 64px; border: none; border-bottom: 1.5px solid #E3E8E6; background: transparent; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 18px; font-weight: 700; color: #121A17; cursor: pointer">Ficha de emergencia
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      <button style="min-height: 64px; border: none; background: transparent; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 18px; font-weight: 700; color: #121A17; cursor: pointer">Conectar WhatsApp y email
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'rosa' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const defs = [
      { id: 'yo', name: 'Yo', initial: 'Y', desc: 'Mi propia historia', canInvite: true, hasFolder: true,
        collabs: [{ name: 'Juan', role: 'Solo ve la carpeta de cáncer' }] },
      { id: 'rosa', name: 'Rosa, mamá', initial: 'R', desc: 'La cuido yo', canInvite: true, hasFolder: false,
        collabs: [{ name: 'Juan, hermano', role: 'Puede ver y cambiar todo' }, { name: 'Laura, cuidadora', role: 'Solo carga tareas y compras' }] },
      { id: 'lola', name: 'Lola, hija', initial: 'L', desc: 'La cuido yo', canInvite: true, hasFolder: false,
        collabs: [{ name: 'Nico, papá', role: 'Puede ver y cambiar todo' }] },
      { id: 'hector', name: 'Héctor, papá', initial: 'H', desc: 'Me sumó a su perfil', canInvite: false, hasFolder: false,
        collabs: [{ name: 'Yo', role: 'Puedo ver y cambiar turnos y remedios' }] }
    ];
    const profiles = defs.map((p) => {
      const on = this.state.who === p.id;
      return {
        ...p,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ who: p.id }),
        row: 'display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 18px; cursor: pointer; color: #121A17; background: #FFFFFF; min-height: 76px; ' + (on ? 'border: 3px solid ' + accent + ';' : 'border: 2px solid #CFD8D4;'),
        avatar: 'width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 21px; ' + (on ? 'background: ' + accent + '; color: #FFFFFF;' : 'background: #E3E8E6; color: #121A17;')
      };
    });
    const s = defs.find((p) => p.id === this.state.who);
    const sel = { ...s, name: s.name.split(',')[0], cannotInvite: !s.canInvite };
    if (s.id === 'yo') sel.name = 'tu historia';
    return { accent, profiles, sel };
  }
}
</script>
</body>
</html>
