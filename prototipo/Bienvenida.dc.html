<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Primera vez</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#4433C9;text-decoration:none}a:hover{color:#2E2391}
button,input{font-family:inherit}
input::placeholder{color:#5E5A78}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F3FA; color: #1A1730; font-family: 'Lexend', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 16px 10px; display: flex; justify-content: center; align-items: center; min-height: 52px; background: #FFFFFF; border-bottom: 1px solid #ECE9F5">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700">
      <span style="width: 34px; height: 34px; border-radius: 999px; background: linear-gradient(135deg, #4433C9 0%, #6D4FE0 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px">N</span>Nosune</span>
  </header>

  <sc-if value="{{isChat}}" hint-placeholder-val="{{true}}">
    <main style="flex: 1; overflow-y: auto; padding: 16px 14px 12px; display: flex; flex-direction: column-reverse; gap: 12px">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
        <sc-if value="{{m.isBot}}" hint-placeholder-val="{{true}}">
          <div style="align-self: flex-start; max-width: 90%; background: #FFFFFF; border: 1px solid #ECE9F5; box-shadow: 0 2px 10px rgba(26,23,48,0.07); border-radius: 22px 22px 22px 6px; padding: 14px 16px; font-size: 18px; line-height: 1.5">{{m.text}}</div>
        </sc-if>
        <sc-if value="{{m.isUser}}" hint-placeholder-val="{{false}}">
          <div style="align-self: flex-end; max-width: 85%; background: #4433C9; color: #FFFFFF; border-radius: 22px 22px 6px 22px; padding: 12px 16px; font-size: 18px; line-height: 1.4">{{m.text}}</div>
        </sc-if>
        <sc-if value="{{m.isAudio}}" hint-placeholder-val="{{false}}">
          <div style="align-self: flex-end; max-width: 88%; background: #4433C9; color: #FFFFFF; border-radius: 22px 22px 6px 22px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
            <span style="display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Audio · 0:52</span>
            <span style="font-size: 16px; line-height: 1.45; color: #E4DEFF">{{m.text}}</span>
          </div>
        </sc-if>
        <sc-if value="{{m.isFound}}" hint-placeholder-val="{{false}}">
          <div style="align-self: flex-start; max-width: 94%; background: #FFFFFF; border: 1px solid #ECE9F5; box-shadow: 0 2px 10px rgba(26,23,48,0.07); border-radius: 22px 22px 22px 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 18px">Ya sé esto de Rosa:</span>
            <sc-for list="{{m.items}}" as="k" hint-placeholder-count="5">
              <span style="display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; border-radius: 14px; background: #F5F3FA"><span style="font-size: 15px; color: #4D4A63">{{k.label}}</span><span style="font-size: 18px; font-weight: 700">{{k.value}}</span></span>
            </sc-for>
            <span style="font-size: 18px; line-height: 1.45">{{m.outro}}</span>
          </div>
        </sc-if>
        <sc-if value="{{m.isDone}}" hint-placeholder-val="{{false}}">
          <div style="align-self: flex-start; max-width: 94%; background: #ECEAFE; border-radius: 22px 22px 22px 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 19px; font-weight: 700">¡Listo! Ya armé el perfil de Rosa:</span>
            <sc-for list="{{m.items}}" as="d" hint-placeholder-count="4">
              <span style="display: flex; align-items: center; gap: 10px; font-size: 17px">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4433C9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>{{d}}</span>
            </sc-for>
            <sc-if value="{{m.hasPending}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 17px; line-height: 1.45; background: #FFF1EA; border-radius: 14px; padding: 10px 12px">{{m.pending}}</span>
            </sc-if>
            <a href="Main.dc.html" style="margin-top: 4px; min-height: 54px; border-radius: 14px; background: #4433C9; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ir al inicio</a>
          </div>
        </sc-if>
      </sc-for>
    </main>

    <div style="background: #FFFFFF; border-top: 1px solid #ECE9F5; padding: 10px 12px 26px; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{hasChips}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
            <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <div style="display: flex; gap: 10px; align-items: center">
        <label style="flex: 1; display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #F5F3FA; border: 1px solid #E2DEEE">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Escribí un mensaje</span>
          <input type="text" placeholder="Escribí o mandá un audio" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 17px; color: #1A1730">
        </label>
        <button onClick="{{mic}}" aria-label="Mandar un audio" style="width: 56px; height: 56px; border-radius: 999px; border: none; background: linear-gradient(135deg, #4433C9 0%, #6D4FE0 100%); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 6px 14px rgba(68,51,201,0.3)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isRecording}}" hint-placeholder-val="{{false}}">
    <main style="flex: 1; overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Te escuchamos</h1>
      <div style="display: flex; justify-content: center; padding: 10px 0">
        <span style="width: 120px; height: 120px; border-radius: 999px; background: linear-gradient(135deg, #4433C9 0%, #6D4FE0 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px #ECEAFE">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </span>
      </div>
      <p style="margin: 8px 0 0; font-size: 19px; line-height: 1.55; background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 2px 10px rgba(26,23,48,0.07)">{{said}}</p>
      <button onClick="{{send}}" style="min-height: 60px; border-radius: 16px; border: none; background: #1A1730; color: #FFFFFF; font-size: 19px; font-weight: 700; cursor: pointer">Mandar</button>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4433C9","options":["#4433C9","#0B5A4C","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'chat', sent: false, qi: 0, ans: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#4433C9';
    const s = this.state;
    const SAID = '“Mi mamá tiene 78 años y es hipertensa. Toma Enalapril a la mañana y a la noche. La ve el doctor Sosa, que es cardiólogo, y su clínica es la doctora Ríos, en el Hospital. Ahora le duele mucho la rodilla.”';
    const known = [
      { label: 'Edad', value: '78 años' },
      { label: 'Enfermedad', value: 'Hipertensión' },
      { label: 'Remedio', value: 'Enalapril, a la mañana y a la noche' },
      { label: 'Médicos', value: 'Dr. Sosa (cardiología) y Dra. Ríos (clínica médica)' },
      { label: 'Algo nuevo', value: 'Dolor de rodilla' }
    ];
    const Q = [
      { id: 'alergia', short: 'las alergias', q: '¿Es alérgica a algún remedio? Es lo primero que va en su ficha de emergencia.', opts: [['si', 'Sí, te cuento'], ['no', 'No'], ['nose', 'No sé']] },
      { id: 'dosis', short: 'la dosis del Enalapril', q: '¿Cuántos miligramos de Enalapril toma? Está escrito en la caja.', opts: [['10', '10 mg'], ['20', '20 mg'], ['foto', 'Sacar foto de la caja']] },
      { id: 'turno', short: 'los próximos turnos', q: '¿Tiene algún turno pedido?', opts: [['si', 'Sí, te cuento'], ['no', 'No por ahora']] },
      { id: 'estudios', short: 'los estudios', q: '¿Tenés estudios recientes a mano? Así su historia arranca completa.', opts: [['foto', 'Sacarles una foto'], ['mail', 'Los tengo en el email'], ['no', 'No tengo']] },
      { id: 'ayuda', short: 'quién más ayuda', q: '¿Alguien más te ayuda a cuidarla? Podés sumarlos para repartir las tareas.', opts: [['invitar', 'Sí, invitar ahora'], ['solo', 'Por ahora, solo yo']] }
    ];
    const label = (qd, v) => v === 'luego' ? 'Más tarde' : v === 'voz' ? 'Te mandé un audio' : (qd.opts.find((o) => o[0] === v) || ['', v])[1];
    const a = s.ans;
    const msgs = [{ isBot: true, text: '¡Hola! Soy Nosune. Para empezar, contame sobre Rosa en un audio: qué enfermedades tiene, qué remedios toma y qué médicos la atienden. Si te olvidás algo, después te pregunto.' }];
    if (s.sent) {
      msgs.push({ isAudio: true, text: SAID });
      msgs.push({ isFound: true, items: known, outro: 'Para que la app te sirva desde hoy, me faltan ' + Q.length + ' datos. Podés saltear los que quieras.' });
      for (let i = 0; i <= Math.min(s.qi, Q.length - 1); i++) {
        msgs.push({ isBot: true, text: Q[i].q });
        if (i < s.qi) msgs.push({ isUser: true, text: label(Q[i], a[Q[i].id]) });
      }
      if (s.qi >= Q.length) {
        const items = ['Ficha con edad y enfermedades', 'Enalapril en las tareas de todos los días', 'Fichas de 2 médicos', 'Carpeta "Dolor de rodilla"'];
        if (a.alergia && a.alergia !== 'luego' && a.alergia !== 'nose') items.push('Alergias en la ficha de emergencia');
        if (a.ayuda === 'invitar') items.push('Invitación para sumar ayuda');
        const pending = Q.filter((x) => a[x.id] === 'luego' || a[x.id] === 'nose').map((x) => x.short);
        msgs.push({ isDone: true, items, hasPending: pending.length > 0, pending: 'Más adelante te pregunto por ' + pending.join(', ') + '.' });
      }
    }
    msgs.reverse();
    const chipStyle = (primary) => 'min-height: 54px; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; text-align: left; padding: 0 16px; ' + (primary ? 'background: #4433C9; color: #FFFFFF; border: 2px solid #4433C9;' : 'background: #FFFFFF; color: #1A1730; border: 2px solid #E2DEEE;');
    const answer = (id, v) => this.setState({ ans: { ...this.state.ans, [id]: v }, qi: this.state.qi + 1 });
    let chips = [];
    if (!s.sent) chips = [{ label: 'Mandar un audio', pick: () => this.setState({ phase: 'recording' }), primary: true }, { label: 'Prefiero escribir', pick: () => this.setState({ phase: 'recording' }), primary: false }];
    else if (s.qi < Q.length) {
      const qd = Q[s.qi];
      chips = qd.opts.map(([v, l]) => ({ label: l, pick: () => answer(qd.id, v), primary: false }));
      chips.push({ label: 'Más tarde', pick: () => answer(qd.id, 'luego'), primary: false });
    }
    chips = chips.map((c) => ({ ...c, style: chipStyle(c.primary) }));
    return {
      accent, msgs, chips, hasChips: chips.length > 0, said: SAID,
      isChat: s.phase === 'chat', isRecording: s.phase === 'recording',
      mic: () => { const st = this.state; if (!st.sent) this.setState({ phase: 'recording' }); else if (st.qi < Q.length) answer(Q[st.qi].id, 'voz'); },
      send: () => this.setState({ phase: 'chat', sent: true, qi: 0, ans: {} })
    };
  }
}
</script>
</body>
</html>
