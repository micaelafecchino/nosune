<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Compras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 52px 20px 12px">
    <span style="font-size: 17px; color: #3F4A47">Rosa · mamá</span>
    <h1 style="margin: 0; font-size: 32px; font-weight: 700">Compras</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <article style="{{it.cardStyle}}">
        <span style="font-size: 22px; font-weight: 700">{{it.name}}</span>
        <span style="{{it.leftStyle}}">{{it.left}}</span>
        <span style="font-size: 17px; color: #3F4A47">{{it.detail}}</span>

        <sc-if value="{{it.showButton}}" hint-placeholder-val="{{true}}">
          <button onClick="{{it.open}}" style="margin-top: 6px; min-height: 56px; border-radius: 14px; border: none; background: #121A17; color: #FFFFFF; font-size: 18px; font-weight: 700; cursor: pointer">Ya lo compramos</button>
        </sc-if>

        <sc-if value="{{it.isOpen}}" hint-placeholder-val="{{false}}">
          <div role="group" aria-label="Quién lo compró" style="margin-top: 6px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 19px; font-weight: 700">¿Quién lo compró?</span>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{it.buyers}}" as="b" hint-placeholder-count="3">
                <button onClick="{{b.pick}}" style="min-height: 56px; border-radius: 14px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; font-size: 18px; font-weight: 700; cursor: pointer">{{b.label}}</button>
              </sc-for>
            </div>
            <button onClick="{{it.cancel}}" style="min-height: 48px; border: none; background: transparent; color: #121A17; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer">Cancelar</button>
          </div>
        </sc-if>

        <sc-if value="{{it.isBought}}" hint-placeholder-val="{{false}}">
          <div role="status" style="margin-top: 6px; background: #E1EFEB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 18px; line-height: 1.45">{{it.boughtText}}</span>
            <button onClick="{{it.undo}}" style="align-self: flex-start; min-height: 44px; border: none; background: transparent; padding: 0; color: #121A17; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer">Deshacer</button>
          </div>
        </sc-if>
      </article>
    </sc-for>
    <button style="min-height: 56px; border-radius: 14px; border: 2px dashed #9AA6A2; background: transparent; color: #121A17; font-size: 18px; font-weight: 700; cursor: pointer">+ Agregar una compra</button>
  </main>

  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: #FFFFFF; border-top: 1.5px solid #CFD8D4; padding: 8px 4px 26px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Turnos</a>
    <a href="Cargar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; margin-top: -30px; color: #121A17; font-size: 16px; font-weight: 700">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-shadow: 0 4px 14px rgba(11,90,76,0.35)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Cargar</a>
    <a href="Diario.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Diario</a>
    <a href="Compras.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: {{accent}}; font-size: 15px; font-weight: 700; background: #E1EFEB">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Compras</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null, bought: {} };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const s = this.state;
    const names = { yo: 'Yo', juan: 'Juan', laura: 'Laura' };
    const base = [
      { id: 'ena', name: 'Enalapril 10 mg', left: 'Quedan 4 días', urgent: true, detail: 'Con receta · se encarga Laura', next: '1 de diciembre' },
      { id: 'pro', name: 'Protectores descartables', left: 'Quedan 9 días', urgent: false, detail: 'Te encargás vos', next: '10 de diciembre' },
      { id: 'cal', name: 'Calcio + vitamina D', left: 'Quedan 18 días', urgent: false, detail: 'Se encarga Juan', next: '15 de diciembre' }
    ];
    const items = base.map((it) => {
      const isOpen = s.open === it.id;
      const by = s.bought[it.id];
      return {
        ...it,
        isOpen, isBought: !!by, showButton: !isOpen && !by,
        boughtText: by ? ((by === 'yo' ? 'Lo compraste vos' : 'Lo compró ' + names[by]) + '. Te avisamos de nuevo el ' + it.next + '.') : '',
        open: () => this.setState({ open: it.id }),
        cancel: () => this.setState({ open: null }),
        undo: () => { const b = { ...this.state.bought }; delete b[it.id]; this.setState({ bought: b }); },
        buyers: ['yo', 'juan', 'laura'].map((id) => ({
          label: names[id],
          pick: () => this.setState({ open: null, bought: { ...this.state.bought, [it.id]: id } })
        })),
        cardStyle: 'border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 4px; ' + (it.urgent && !by ? 'background: #FFF6EC; border: 2px solid #D9A06B;' : 'background: #FFFFFF; border: 1.5px solid #CFD8D4;'),
        leftStyle: 'font-size: 19px; font-weight: 700; ' + (it.urgent && !by ? 'color: #7A3A06;' : 'color: #121A17;')
      };
    });
    return { accent, items };
  }
}
</script>
</body>
</html>
