<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Preguntar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button,input{font-family:inherit}
input::placeholder{color:#5B6663}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 10px; background: #FFFFFF; border-bottom: 1.5px solid #CFD8D4">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver</a>
    <h1 style="margin: 4px 10px 0; font-size: 26px; font-weight: 700">Preguntá sobre Rosa</h1>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; max-width: 85%; background: {{accent}}; color: #FFFFFF; border-radius: 20px 20px 6px 20px; padding: 12px 16px; font-size: 18px; line-height: 1.4">{{m.q}}</div>
      <div style="align-self: flex-start; max-width: 92%; background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px 20px 20px 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 18px; line-height: 1.5">{{m.a}}</span>
        <span style="font-size: 16px; color: #3F4A47">{{m.src}}</span>
      </div>
    </sc-for>

    <sc-if value="{{hasSuggestions}}" hint-placeholder-val="{{true}}">
      <span style="font-size: 18px; font-weight: 700; margin-top: 6px">Podés preguntar:</span>
      <sc-for list="{{suggestions}}" as="sg" hint-placeholder-count="3">
        <button onClick="{{sg.ask}}" style="min-height: 56px; padding: 10px 16px; border-radius: 16px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left">{{sg.q}}</button>
      </sc-for>
    </sc-if>
  </main>

  <div style="padding: 12px 12px 30px; background: #FFFFFF; border-top: 1.5px solid #CFD8D4; display: flex; gap: 10px; align-items: center">
    <label style="flex: 1; display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 16px; background: #F2F4F3; border: 1.5px solid #CFD8D4">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tu pregunta</span>
      <input type="text" placeholder="Escribí tu pregunta" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 18px; color: #121A17">
    </label>
    <button aria-label="Preguntar hablando" style="width: 56px; height: 56px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { asked: ['meds'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const qa = {
      meds: { q: '¿Qué remedios toma?', a: 'Enalapril 10 mg dos veces por día, a las 8 y a las 20. Y Calcio con vitamina D a la noche.', src: 'Según la receta del 28 de septiembre.' },
      alergia: { q: '¿Es alérgica a algo?', a: 'Sí, a la penicilina.', src: 'Según su ficha de emergencia.' },
      analisis: { q: '¿Cuándo fue su último análisis?', a: 'El 3 de octubre. Tiene otro el viernes 7 de noviembre a las 7:30, en ayunas.', src: 'Según sus turnos.' },
      rodilla: { q: '¿Qué le dijeron de la rodilla?', a: 'La Dra. Ríos pidió que la vea un traumatólogo. Todavía falta pedir ese turno.', src: 'Según la consulta del 20 de octubre.' }
    };
    const asked = this.state.asked;
    const msgs = asked.map((id) => qa[id]);
    const suggestions = Object.keys(qa).filter((id) => asked.indexOf(id) === -1).map((id) => ({
      q: qa[id].q,
      ask: () => this.setState({ asked: this.state.asked.concat([id]) })
    }));
    return { accent, msgs, suggestions, hasSuggestions: suggestions.length > 0 };
  }
}
</script>
</body>
</html>
