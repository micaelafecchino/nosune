<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Cargar un turno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 4px; display: flex; justify-content: space-between; align-items: center">
    <a href="Agenda.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Cerrar</a>
    <sc-if value="{{canGoBack}}" hint-placeholder-val="{{false}}">
      <button onClick="{{back}}" style="min-height: 52px; padding: 0 12px; border: none; background: transparent; color: #121A17; font-size: 18px; font-weight: 700; text-decoration: underline; cursor: pointer">Atrás</button>
    </sc-if>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 14px">

    <sc-if value="{{isWhat}}" hint-placeholder-val="{{true}}">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">¿Qué querés cargar?</h1>
      <span style="font-size: 18px; color: #3F4A47">Para Rosa</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
          <button onClick="{{t.pick}}" style="min-height: 104px; border-radius: 20px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; font-size: 18px; font-weight: 700; text-align: center">
            <span style="width: 44px; height: 44px; border-radius: 12px; background: #E1EFEB; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">{{t.mark}}</span>{{t.label}}</button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isHow}}" hint-placeholder-val="{{false}}">
      <span style="font-size: 18px; color: #3F4A47">{{typeLabel}}</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">¿Cómo lo querés cargar?</h1>
      <button onClick="{{startAudio}}" style="min-height: 88px; border-radius: 20px; border: none; background: {{accent}}; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 21px; font-weight: 700">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Hablar</button>
      <button onClick="{{startPhoto}}" style="min-height: 88px; border-radius: 20px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 21px; font-weight: 700">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>{{photoLabel}}</button>
      <button onClick="{{startPhoto}}" style="min-height: 88px; border-radius: 20px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 0 20px; font-size: 21px; font-weight: 700">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Escribir</button>
    </sc-if>

    <sc-if value="{{isRecording}}" hint-placeholder-val="{{false}}">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Te escuchamos</h1>
      <div style="display: flex; justify-content: center; padding: 8px 0">
        <span style="width: 120px; height: 120px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </span>
      </div>
      <p style="margin: 0; font-size: 19px; line-height: 1.55; background: #FFFFFF; border-radius: 18px; padding: 16px">{{cur.said}}</p>
      <button onClick="{{finish}}" style="min-height: 60px; border-radius: 16px; border: none; background: #121A17; color: #FFFFFF; font-size: 19px; font-weight: 700; cursor: pointer">Terminé</button>
    </sc-if>

    <sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">¿Está bien así?</h1>
      <div style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 17px; color: #3F4A47">{{cur.kicker}}</span>
        <span style="font-size: 24px; font-weight: 700">{{cur.title}}</span>
        <span style="font-size: 19px">{{cur.line1}}</span>
        <span style="font-size: 18px; color: #3F4A47">{{cur.line2}}</span>
      </div>
      <div role="group" aria-labelledby="quien" style="display: flex; flex-direction: column; gap: 10px">
        <span id="quien" style="font-size: 20px; font-weight: 700">{{cur.question}}</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{owners}}" as="o" hint-placeholder-count="4">
            <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
          </sc-for>
        </div>
      </div>
      <button onClick="{{save}}" style="min-height: 60px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 700; cursor: pointer">Sí, guardar</button>
    </sc-if>

    <sc-if value="{{isSaved}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background: #E1EFEB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
        <span style="font-size: 24px; font-weight: 700">Guardado</span>
        <span style="font-size: 19px; line-height: 1.5">{{savedText}}</span>
        <a href="Agenda.dc.html" style="min-height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ver mis turnos</a>
        <button onClick="{{reset}}" style="min-height: 52px; border: none; background: transparent; color: #121A17; font-size: 18px; font-weight: 700; text-decoration: underline; cursor: pointer">Cargar otro turno</button>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'how', type: 'turno', owner: 'juan' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const s = this.state;
    const T = {
      turno: { label: 'Un turno', mark: 'T', photo: 'Foto del turno o del chat', said: '“A mamá le dieron turno con el traumatólogo, el doctor Herrera, el martes 18 a las 10, en el Sanatorio.”', kicker: 'Turno nuevo', title: 'Traumatología', line1: 'Martes 18 de noviembre, 10:00', line2: 'Dr. Herrera · Sanatorio [NOMBRE]', question: '¿Quién la acompaña?', done: 'Turno con traumatología el martes 18 a las 10.' },
      consulta: { label: 'Cómo le fue en el médico', mark: 'C', photo: 'Foto de lo que le dieron', said: '“Fuimos a la clínica, la doctora Ríos dijo que la presión está bien y pidió un análisis de sangre.”', kicker: 'Consulta de hoy', title: 'Clínica médica', line1: 'Dra. Paula Ríos', line2: 'Pidió un análisis de sangre', question: '¿Quién fue con ella?', done: 'Guardamos la consulta y agregamos el análisis a lo que hay que hacer.' },
      estudio: { label: 'Un estudio o resultado', mark: 'E', photo: 'Foto del resultado', said: '“Llegaron los resultados del análisis de sangre del 3 de octubre.”', kicker: 'Resultado', title: 'Análisis de sangre', line1: '3 de octubre', line2: 'Laboratorio [NOMBRE]', question: '¿A quién le avisamos?', done: 'Guardamos el resultado en su historia.' },
      compra: { label: 'Un remedio o compra', mark: 'R', photo: 'Foto de la caja o la receta', said: '“Hay que comprarle protectores descartables todos los meses.”', kicker: 'Compra que se repite', title: 'Protectores descartables', line1: 'Cada 30 días', line2: 'No necesita receta', question: '¿Quién se encarga?', done: 'Te vamos a avisar unos días antes de que se terminen.' },
      gasto: { label: 'Un gasto', mark: '$', photo: 'Foto del ticket', said: '“Gasté dieciocho mil quinientos en la farmacia por el Enalapril.”', kicker: 'Gasto', title: '$ 18.500 · Farmacia', line1: 'Enalapril 10 mg', line2: 'Hoy, 1 de noviembre', question: '¿Quién lo pagó?', done: 'Guardamos el gasto de $ 18.500.' },
      tarea: { label: 'Una tarea de todos los días', mark: 'D', photo: 'Foto de la indicación', said: '“Tiene que hacer los ejercicios de rodilla todos los días a las 5 de la tarde.”', kicker: 'Tarea diaria', title: 'Ejercicios de rodilla', line1: 'Todos los días, 17:00', line2: '15 minutos', question: '¿A quién le toca?', done: 'La agregamos a las tareas de todos los días.' }
    };
    const order = ['turno', 'consulta', 'estudio', 'compra', 'gasto', 'tarea'];
    const types = order.map((id) => ({ label: T[id].label, mark: T[id].mark, pick: () => this.setState({ type: id, step: 'how' }) }));
    const cur = T[s.type];
    const names = { yo: 'Yo', juan: 'Juan', laura: 'Laura', none: 'Nadie todavía' };
    const owners = ['yo', 'juan', 'laura', 'none'].map((id) => {
      const on = s.owner === id;
      return {
        label: names[id], pressed: on ? 'true' : 'false',
        pick: () => this.setState({ owner: id }),
        style: 'min-height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #121A17; color: #FFFFFF; border: 2px solid #121A17;' : 'background: #FFFFFF; color: #121A17; border: 2px solid #CFD8D4;')
      };
    });
    const prev = { recording: 'how', review: 'how' };
    return {
      accent, types, owners, cur,
      typeLabel: cur.label,
      photoLabel: cur.photo,
      isWhat: s.step === 'what', isHow: s.step === 'how', isRecording: s.step === 'recording', isReview: s.step === 'review', isSaved: s.step === 'saved',
      canGoBack: !!prev[s.step],
      back: () => this.setState({ step: prev[this.state.step] || 'what' }),
      savedText: cur.done + ' Le avisamos a la familia.',
      startAudio: () => this.setState({ step: 'recording' }),
      startPhoto: () => this.setState({ step: 'review' }),
      finish: () => this.setState({ step: 'review' }),
      save: () => this.setState({ step: 'saved' }),
      reset: () => this.setState({ step: 'how' })
    };
  }
}
</script>
</body>
</html>
