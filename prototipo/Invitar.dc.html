<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Sumar a la familia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#4433C9;text-decoration:none}a:hover{color:#2E2391}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F3FA; color: #1A1730; font-family: 'Lexend', system-ui, sans-serif; overflow: hidden">
  <header style="padding: 48px 20px 4px; min-height: 52px; display: flex; align-items: center">
    <span style="font-size: 17px; font-weight: 600; color: #4D4A63">Paso 2 de 3</span>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700">¿Quién más ayuda con Rosa?</h1>
    <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #4D4A63">Cuando se suman, cada uno ve lo que le toca y le llegan los avisos. Así nadie se queda con todo.</p>

    <div role="group" aria-labelledby="perm" style="display: flex; flex-direction: column; gap: 10px">
      <span id="perm" style="font-size: 18px; font-weight: 700">¿Qué va a poder hacer?</span>
      <sc-for list="{{perms}}" as="p" hint-placeholder-count="2">
        <button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.card}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 19px; font-weight: 700">{{p.title}}</span>
            <span style="font-size: 16px; color: #4D4A63">{{p.text}}</span>
          </span>
          <span style="{{p.radio}}"></span>
        </button>
      </sc-for>
    </div>

    <button onClick="{{invite}}" style="min-height: 60px; border-radius: 16px; border: none; background: #4433C9; color: #FFFFFF; font-size: 19px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/></svg>Invitar por WhatsApp</button>

    <sc-if value="{{hasInvited}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background: #ECEAFE; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 18px; font-weight: 700">Le mandaste la invitación a Juan</span>
        <span style="font-size: 16px; color: #4D4A63">Te avisamos cuando se sume. Podés invitar a alguien más.</span>
      </div>
    </sc-if>

    <a href="Avisos.dc.html" style="min-height: 60px; border-radius: 16px; background: #1A1730; color: #FFFFFF; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 6px">{{nextLabel}}</a>
    <sc-if value="{{notInvited}}" hint-placeholder-val="{{true}}">
      <a href="Avisos.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #1A1730; text-decoration: underline">Lo hago después</a>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { perm: 'todo', invited: false };
  }
  renderVals() {
    const s = this.state;
    const perms = [
      { id: 'todo', title: 'Ver y cambiar todo', text: 'Para hermanos o familiares cercanos' },
      { id: 'restringido', title: 'Solo tareas y compras', text: 'Para una cuidadora: no ve la historia clínica' }
    ].map((p) => {
      const on = s.perm === p.id;
      return {
        ...p, pressed: on ? 'true' : 'false', pick: () => this.setState({ perm: p.id }),
        card: 'display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; cursor: pointer; color: #1A1730; background: #FFFFFF; min-height: 76px; ' + (on ? 'border: 3px solid #4433C9;' : 'border: 2px solid #E2DEEE;'),
        radio: 'width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; ' + (on ? 'border: 9px solid #4433C9;' : 'border: 3px solid #6E6A88;')
      };
    });
    return {
      perms, hasInvited: s.invited, notInvited: !s.invited,
      invite: () => this.setState({ invited: true }),
      nextLabel: s.invited ? 'Seguir' : 'Seguir sin invitar'
    };
  }
}
</script>
</body>
</html>
