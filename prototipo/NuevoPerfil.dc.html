<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Crear perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0E6B5B;text-decoration:none}a:hover{color:#0A4F43}
button,input{font-family:inherit}
input::placeholder{color:#5A6662}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F5; color: #16201D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Familia.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #16201D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 600">Nuevo perfil</span>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">¿De quién es este perfil?</h1>

    <sc-if value="{{created}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background: #E3F1EE; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; font-weight: 700; color: #0A4F43">{{doneTitle}}</span>
        <span style="font-size: 14px; line-height: 1.5">{{doneText}}</span>
        <a href="Familia.dc.html" style="min-height: 40px; padding: 0 14px; display: flex; align-items: center; align-self: flex-start; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600">Ir a perfiles</a>
      </div>
    </sc-if>

    <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="{{k.card}}">
            <span style="{{k.radio}}"></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; text-align: left">
              <span style="font-size: 16px; font-weight: 700">{{k.title}}</span>
              <span style="font-size: 13px; line-height: 1.45; color: #4A5653">{{k.text}}</span>
            </span>
          </button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600">Nombre</span>
          <input type="text" placeholder="Ej.: Pedro" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 15px; color: #16201D">
        </label>

        <div role="group" aria-labelledby="relq" style="display: flex; flex-direction: column; gap: 6px">
          <span id="relq" style="font-size: 13px; font-weight: 600">Relación con vos</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{rels}}" as="r" hint-placeholder-count="5">
              <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
            </sc-for>
          </div>
        </div>

        <sc-if value="{{isManaged}}" hint-placeholder-val="{{true}}">
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600">Fecha de nacimiento</span>
            <input type="text" placeholder="DD/MM/AAAA" inputmode="numeric" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 15px; color: #16201D">
          </label>
        </sc-if>
        <sc-if value="{{isInvite}}" hint-placeholder-val="{{false}}">
          <label style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600">Celular o email para invitar</span>
            <input type="text" placeholder="Ej.: +54 9 11 …" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9D3CF; background: #FFFFFF; font-size: 15px; color: #16201D">
          </label>
        </sc-if>
      </div>

      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4A5653; background: #FFFFFF; border: 1px solid #E2E7E5; border-radius: 14px; padding: 12px 14px">{{hint}}</p>
    </sc-if>
  </main>

  <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
    <div style="padding: 12px 20px 32px; border-top: 1px solid #E2E7E5">
      <button onClick="{{create}}" style="width: 100%; min-height: 50px; border-radius: 14px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">{{cta}}</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B5B","options":["#0E6B5B","#2F5DA8","#6B3FA0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'managed', rel: 'abuelo', created: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B5B';
    const s = this.state;
    const kindDefs = [
      { id: 'managed', title: 'No tiene cuenta', text: 'Un bebé, un abuelo, alguien que no usa celular. Lo administrás vos y podés sumar colaboradores.' },
      { id: 'invite', title: 'Va a tener su propia cuenta', text: 'Le mandás una invitación. Esa persona es dueña de su perfil y decide a quién suma.' }
    ];
    const kinds = kindDefs.map((k) => {
      const on = s.kind === k.id;
      return {
        ...k,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ kind: k.id }),
        card: 'display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 16px; cursor: pointer; color: #16201D; background: #FFFFFF; ' + (on ? 'border: 2px solid ' + accent + ';' : 'border: 2px solid #E2E7E5;'),
        radio: 'width: 22px; height: 22px; margin-top: 1px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; ' + (on ? 'border: 7px solid ' + accent + ';' : 'border: 2px solid #9AA6A2;')
      };
    });
    const relDefs = [['hijo', 'Hijo/a'], ['padre', 'Mamá / papá'], ['abuelo', 'Abuelo/a'], ['pareja', 'Pareja'], ['otro', 'Otro']];
    const rels = relDefs.map(([id, label]) => {
      const on = s.rel === id;
      return {
        label, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ rel: id }),
        style: 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #16201D; color: #FFFFFF; border: 1px solid #16201D;' : 'background: #FFFFFF; color: #16201D; border: 1px solid #E2E7E5;')
      };
    });
    const managed = s.kind === 'managed';
    return {
      accent, kinds, rels,
      isManaged: managed, isInvite: !managed,
      created: s.created, editing: !s.created,
      hint: managed
        ? 'Vas a ser quien administra este perfil. Si esta persona algún día crea su cuenta, le podés transferir el perfil con toda su historia.'
        : 'Cuando acepte, el perfil pasa a ser suyo. Vos quedás como colaborador con los permisos que te dé.',
      cta: managed ? 'Crear perfil' : 'Enviar invitación',
      create: () => this.setState({ created: true }),
      doneTitle: managed ? 'Perfil creado' : 'Invitación enviada',
      doneText: managed
        ? 'Ya podés cargar turnos, estudios y medicación, y sumar colaboradores para que te ayuden.'
        : 'Cuando la acepte, vas a ver su perfil en tu lista con los permisos que te dé.'
    };
  }
}
</script>
</body>
</html>
