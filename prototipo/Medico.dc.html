<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Ficha del médico</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 4px">
    <a href="Medicos.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver</a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Dra. Paula Ríos</h1>
      <span style="font-size: 19px">Clínica médica</span>
      <span style="font-size: 18px; color: #3F4A47">Hospital [NOMBRE]</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="min-height: 58px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Llamar a la secretaría</button>
      <button style="min-height: 58px; border-radius: 16px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; font-size: 18px; font-weight: 700; cursor: pointer">Mandar un WhatsApp</button>
      <button style="min-height: 58px; border-radius: 16px; border: 2px solid #CFD8D4; background: #FFFFFF; color: #121A17; font-size: 18px; font-weight: 700; cursor: pointer">Mandar un email</button>
    </div>

    <section aria-labelledby="datos" style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; display: flex; flex-direction: column">
      <h2 id="datos" style="margin: 0; padding: 16px 18px 4px; font-size: 20px; font-weight: 700">Datos</h2>
      <div style="padding: 12px 18px; border-bottom: 1.5px solid #E3E8E6; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #3F4A47">Dirección</span><span style="font-size: 18px">[DIRECCIÓN], piso 3</span></div>
      <div style="padding: 12px 18px; border-bottom: 1.5px solid #E3E8E6; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #3F4A47">Atiende</span><span style="font-size: 18px">Lunes y miércoles, de 14 a 18</span></div>
      <div style="padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; color: #3F4A47">Para pedir turno</span><span style="font-size: 18px">WhatsApp a la secretaría</span></div>
    </section>

    <p style="margin: 0; background: #FFF6EC; border-radius: 18px; padding: 16px 18px; font-size: 18px; line-height: 1.5">Prefiere recibir los estudios por email antes de la consulta.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B5A4C' };
  }
}
</script>
</body>
</html>
