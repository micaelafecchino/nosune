<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Turnos anteriores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#121A17;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <div>
      <span style="font-size: 17px; color: #3F4A47">Rosa · mamá</span>
      <h1 style="margin: 0; font-size: 32px; font-weight: 700">Turnos</h1>
    </div>
    <nav aria-label="Turnos" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #DCE3E0; padding: 4px; border-radius: 14px">
      <a href="Agenda.dc.html" style="min-height: 48px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #3F4A47">Próximos</a>
      <a href="Historia.dc.html" aria-current="page" style="min-height: 48px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #121A17; background: #FFFFFF">Anteriores</a>
    </nav>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="Mostrar" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{folders}}" as="fo" hint-placeholder-count="4">
        <button onClick="{{fo.pick}}" aria-pressed="{{fo.pressed}}" style="{{fo.style}}">{{fo.name}}</button>
      </sc-for>
    </div>

    <button onClick="{{toggleMore}}" aria-expanded="{{moreOpen}}" style="align-self: flex-start; min-height: 48px; padding: 0 4px; border: none; background: transparent; color: #121A17; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer">{{moreLabel}}</button>

    <sc-if value="{{showMore}}" hint-placeholder-val="{{false}}">
      <div style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
          <div role="group" aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 17px; font-weight: 700">{{g.label}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{g.options}}" as="o" hint-placeholder-count="3">
                <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <sc-if value="{{it.showMonth}}" hint-placeholder-val="{{false}}">
        <h2 style="margin: 10px 0 0; font-size: 19px; font-weight: 700">{{it.month}}</h2>
      </sc-if>
      <a href="{{it.href}}" style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 18px; padding: 16px 18px; display: flex; gap: 12px; align-items: center; min-height: 56px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 19px; font-weight: 700">{{it.title}}</span>
          <span style="font-size: 17px; color: #3F4A47">{{it.sub}}</span>
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4A47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; padding: 18px; text-align: center; font-size: 18px; color: #3F4A47; background: #FFFFFF; border-radius: 18px">No hay nada con estos filtros.</p>
    </sc-if>
  </main>

  <nav aria-label="Principal" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: #FFFFFF; border-top: 1.5px solid #CFD8D4; padding: 8px 4px 26px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="Agenda.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: {{accent}}; font-size: 15px; font-weight: 700; background: #E1EFEB">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Turnos</a>
    <a href="Cargar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; margin-top: -30px; color: #121A17; font-size: 16px; font-weight: 700">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-shadow: 0 4px 14px rgba(11,90,76,0.35)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Cargar</a>
    <a href="Diario.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Diario</a>
    <a href="Compras.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; justify-content: center; border-radius: 14px; color: #3F4A47; font-size: 15px; font-weight: 700">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Compras</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { folder: 'all', fecha: 'all', medico: 'all', more: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const s = this.state;
    const all = [
      { folders: ['rodilla'], y: 2026, month: 'Octubre', title: 'Radiografía de rodilla', sub: '22 de octubre', medico: 'rios', href: 'Historia.dc.html' },
      { folders: ['dia', 'rodilla'], y: 2026, month: 'Octubre', title: 'Clínica médica', sub: '20 de octubre · Dra. Paula Ríos', medico: 'rios', href: 'Consulta.dc.html' },
      { folders: ['dia', 'hta'], y: 2026, month: 'Octubre', title: 'Análisis de sangre', sub: '3 de octubre', medico: 'sosa', href: 'Historia.dc.html' },
      { folders: ['hta'], y: 2026, month: 'Septiembre', title: 'Cardiología', sub: '28 de septiembre · Dr. Martín Sosa', medico: 'sosa', href: 'Historia.dc.html' },
      { folders: ['hta'], y: 2026, month: 'Septiembre', title: 'Ecocardiograma', sub: '12 de septiembre', medico: 'sosa', href: 'Historia.dc.html' },
      { folders: ['dia'], y: 2026, month: 'Julio', title: 'Oftalmología', sub: '3 de julio · Dra. Lucía Benítez', medico: 'benitez', href: 'Historia.dc.html' },
      { folders: ['dia'], y: 2025, month: 'Diciembre de 2025', title: 'Clínica médica', sub: '2 de diciembre · Dra. Paula Ríos', medico: 'rios', href: 'Historia.dc.html' }
    ];
    const chip = (on) => 'min-height: 48px; padding: 0 18px; border-radius: 999px; font-size: 17px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #121A17; color: #FFFFFF; border: 2px solid #121A17;' : 'background: #FFFFFF; color: #121A17; border: 2px solid #CFD8D4;');
    const folderDefs = [['all', 'Todo'], ['dia', 'Día a día'], ['hta', 'Presión'], ['rodilla', 'Rodilla']];
    const folders = folderDefs.map(([id, name]) => ({
      name, pressed: s.folder === id ? 'true' : 'false',
      pick: () => this.setState({ folder: id }),
      style: chip(s.folder === id)
    }));
    const mk = (key, label, opts) => ({
      label,
      options: opts.map(([id, l]) => ({ label: l, pressed: s[key] === id ? 'true' : 'false', pick: () => this.setState({ [key]: id }), style: chip(s[key] === id) }))
    });
    const groups = [
      mk('fecha', 'Cuándo', [['all', 'Siempre'], ['2026', 'Este año'], ['2025', 'Año pasado']]),
      mk('medico', 'Médico', [['all', 'Todos'], ['rios', 'Dra. Ríos'], ['sosa', 'Dr. Sosa'], ['benitez', 'Dra. Benítez']])
    ];
    const list = all.filter((x) => (s.folder === 'all' || x.folders.includes(s.folder)) && (s.fecha === 'all' || String(x.y) === s.fecha) && (s.medico === 'all' || x.medico === s.medico));
    const items = list.map((x, i) => ({ ...x, showMonth: i === 0 || list[i - 1].month !== x.month }));
    return {
      accent, folders, groups, items, empty: items.length === 0,
      showMore: s.more, moreOpen: s.more ? 'true' : 'false',
      moreLabel: s.more ? 'Ocultar filtros' : 'Más filtros',
      toggleMore: () => this.setState({ more: !this.state.more })
    };
  }
}
</script>
</body>
</html>
