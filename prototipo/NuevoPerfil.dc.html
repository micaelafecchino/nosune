<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Agregar a alguien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button,input{font-family:inherit}
input::placeholder{color:#5B6663}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 4px">
    <a href="Familia.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Cerrar</a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700">Agregar a alguien</h1>

    <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
      <span style="font-size: 20px; font-weight: 700">¿Usa celular?</span>
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
        <button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="{{k.card}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; text-align: left">
            <span style="font-size: 20px; font-weight: 700">{{k.title}}</span>
            <span style="font-size: 17px; line-height: 1.4; color: #3F4A47">{{k.text}}</span>
          </span>
          <span style="{{k.radio}}"></span>
        </button>
      </sc-for>

      <label style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
        <span style="font-size: 19px; font-weight: 700">Nombre</span>
        <input type="text" placeholder="Ej.: Pedro" style="min-height: 58px; padding: 0 16px; border-radius: 14px; border: 2px solid #9AA6A2; background: #FFFFFF; font-size: 19px; color: #121A17">
      </label>
      <sc-if value="{{isInvite}}" hint-placeholder-val="{{false}}">
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 19px; font-weight: 700">Su número de celular</span>
          <input type="tel" placeholder="Ej.: 11 1234 5678" style="min-height: 58px; padding: 0 16px; border-radius: 14px; border: 2px solid #9AA6A2; background: #FFFFFF; font-size: 19px; color: #121A17">
        </label>
      </sc-if>

      <button onClick="{{create}}" style="min-height: 60px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 700; cursor: pointer; margin-top: 4px">{{cta}}</button>
    </sc-if>

    <sc-if value="{{created}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background: #E1EFEB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 24px; font-weight: 700">{{doneTitle}}</span>
        <span style="font-size: 19px; line-height: 1.5">{{doneText}}</span>
        <a href="Familia.dc.html" style="min-height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Listo</a>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'managed', created: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0B5A4C';
    const s = this.state;
    const kindDefs = [
      { id: 'managed', title: 'No', text: 'Por ejemplo, un bebé o un abuelo. Vos cargás todo por esa persona.' },
      { id: 'invite', title: 'Sí', text: 'Le mandamos un mensaje para que entre a la app.' }
    ];
    const kinds = kindDefs.map((k) => {
      const on = s.kind === k.id;
      return {
        ...k,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ kind: k.id }),
        card: 'display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 18px; cursor: pointer; color: #121A17; background: #FFFFFF; ' + (on ? 'border: 3px solid ' + accent + ';' : 'border: 2px solid #CFD8D4;'),
        radio: 'width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; ' + (on ? 'border: 9px solid ' + accent + ';' : 'border: 3px solid #6B7773;')
      };
    });
    const managed = s.kind === 'managed';
    return {
      accent, kinds,
      isInvite: !managed,
      editing: !s.created, created: s.created,
      cta: managed ? 'Agregar' : 'Mandar invitación',
      create: () => this.setState({ created: true }),
      doneTitle: managed ? 'Agregado' : 'Invitación enviada',
      doneText: managed ? 'Ya podés cargar sus turnos, remedios y tareas.' : 'Cuando entre a la app, lo vas a ver en tu lista.'
    };
  }
}
</script>
</body>
</html>
