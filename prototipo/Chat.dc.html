<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Asistente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5B;text-decoration:none}a:hover{color:#0A4F43}
button,input{font-family:inherit}
input::placeholder{color:#5A6662}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F5; color: #16201D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 10px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E2E7E5; background: #FFFFFF">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #16201D; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">Preguntale a Nosune</h1>
      <span style="font-size: 12px; color: #5A6662">Responde con lo cargado en el perfil de Rosa</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; max-width: 80%; background: {{accent}}; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.4">{{m.q}}</div>
      <div style="align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 8px">
        <div style="background: #FFFFFF; border: 1px solid #E2E7E5; border-radius: 18px 18px 18px 4px; padding: 12px 14px; font-size: 15px; line-height: 1.5; color: #16201D">{{m.a}}</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
          <span style="font-size: 11px; color: #5A6662">Fuentes:</span>
          <sc-for list="{{m.src}}" as="sr" hint-placeholder-count="1">
            <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #E3F1EE; color: #0A4F43">{{sr.label}}</span>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{hasSuggestions}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
        <span style="font-size: 12px; font-weight: 600; color: #5A6662">Preguntas rápidas</span>
        <sc-for list="{{suggestions}}" as="sg" hint-placeholder-count="3">
          <button onClick="{{sg.ask}}" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #C9D3CF; background: #FFFFFF; color: #16201D; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left">{{sg.q}}</button>
        </sc-for>
      </div>
    </sc-if>
  </main>

  <div style="padding: 10px 12px 30px; background: #FFFFFF; border-top: 1px solid #E2E7E5; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex: 1; display: flex; align-items: center; min-height: 46px; padding: 0 14px; border-radius: 999px; background: #F4F6F5; border: 1px solid #E2E7E5">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tu pregunta</span>
        <input type="text" placeholder="Ej.: ¿qué estudios se hizo este año?" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: #16201D">
      </label>
      <button aria-label="Preguntar con la voz" style="width: 46px; height: 46px; border-radius: 999px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <span style="font-size: 11px; color: #5A6662; text-align: center">Solo usa la información cargada en Nosune. No reemplaza la opinión médica.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B5B","options":["#0E6B5B","#2F5DA8","#6B3FA0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { asked: ['meds'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E6B5B';
    const qa = {
      meds: { q: '¿Qué medicación toma y en qué dosis?', a: 'Enalapril 10 mg cada 12 horas (8:00 y 20:00), indicado por el Dr. Martín Sosa en Cardiología el 28 de septiembre. También toma Calcio + vitamina D una vez por día, a la noche.', src: ['Receta 28 sep', 'Control diario'] },
      alergia: { q: '¿Es alérgica a algo?', a: 'Sí, a la penicilina. Está cargado en su ficha de emergencia.', src: ['Ficha de emergencia'] },
      analisis: { q: '¿Cuándo fue su último análisis de sangre?', a: 'El 3 de octubre: rutina y función renal. Tiene otro el viernes 7 de noviembre a las 7:30, en ayunas; la lleva Juan.', src: ['Análisis 3 oct', 'Turnos'] },
      rodilla: { q: '¿Qué le dijeron de la rodilla?', a: 'La Dra. Paula Ríos (Clínica médica, 20 de octubre) la derivó a traumatología por un dolor en la rodilla derecha de hace 3 semanas. Hay una radiografía del 22 de octubre. El turno con traumatología todavía no tiene responsable.', src: ['Consulta 20 oct', 'Radiografía 22 oct'] }
    };
    const asked = this.state.asked;
    const msgs = asked.map((id) => ({ q: qa[id].q, a: qa[id].a, src: qa[id].src.map((label) => ({ label })) }));
    const suggestions = Object.keys(qa).filter((id) => asked.indexOf(id) === -1).map((id) => ({
      q: qa[id].q,
      ask: () => this.setState({ asked: this.state.asked.concat([id]) })
    }));
    return { accent, msgs, suggestions, hasSuggestions: suggestions.length > 0 };
  }
}
</script>
</body>
</html>
