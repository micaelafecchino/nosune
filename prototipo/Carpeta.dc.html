<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nosune · Carpeta Cáncer de mama</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
main>*{flex-shrink:0}
a{color:#0B5A4C;text-decoration:none}a:hover{color:#08453A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F3; color: #121A17; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">

  <header style="padding: 48px 12px 4px">
    <a href="Familia.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 10px; color: #121A17; font-size: 18px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Volver</a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <span style="font-size: 17px; color: #3F4A47">Mi carpeta</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Cáncer de mama</h1>
    </div>

    <div style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <span style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Privada</span>
      <span style="font-size: 18px; line-height: 1.45">Solo la ven vos y Juan.</span>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-top: 1.5px solid #E3E8E6; padding-top: 8px; cursor: pointer">
        <span style="font-size: 18px">Mostrarla junto con el resto de mi historia</span>
        <input type="checkbox" checked="{{inDaily}}" onChange="{{toggleDaily}}" style="width: 30px; height: 30px; margin: 0; flex-shrink: 0; accent-color: {{accent}}">
      </label>
    </div>

    <div style="background: #FFFFFF; border: 1.5px solid #CFD8D4; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; color: #3F4A47">Próximo</span>
      <span style="font-size: 22px; font-weight: 700">Quimioterapia, sesión 4 de 6</span>
      <span style="font-size: 19px">Lunes 10 de noviembre, 9:00</span>
      <span style="font-size: 18px; color: #3F4A47">Hospital [NOMBRE] · va con Juan</span>
    </div>

    <section aria-labelledby="regs" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="regs" style="margin: 0; font-size: 21px; font-weight: 700">Lo último</h2>
      <a href="Carpeta.dc.html" style="min-height: 64px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #CFD8D4; display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; color: #121A17"><span style="font-size: 19px; font-weight: 700">Consulta con oncología</span><span style="font-size: 17px; color: #3F4A47">20 de octubre · Dra. Ana Medina</span></a>
      <a href="Carpeta.dc.html" style="min-height: 64px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #CFD8D4; display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; color: #121A17"><span style="font-size: 19px; font-weight: 700">Análisis de sangre</span><span style="font-size: 17px; color: #3F4A47">3 de octubre</span></a>
      <a href="Carpeta.dc.html" style="min-height: 64px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #CFD8D4; display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; color: #121A17"><span style="font-size: 19px; font-weight: 700">Resonancia</span><span style="font-size: 17px; color: #3F4A47">2 de junio</span></a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B5A4C","options":["#0B5A4C","#234A87","#5B3289"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inDaily: false };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#0B5A4C',
      inDaily: this.state.inDaily,
      toggleDaily: () => this.setState({ inDaily: !this.state.inDaily })
    };
  }
}
</script>
</body>
</html>
